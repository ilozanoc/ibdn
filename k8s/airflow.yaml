apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log"]
  verbs: ["get", "list", "create", "delete", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: airflow-sa
  namespace: default
roleRef:
  kind: Role
  name: airflow-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      serviceAccountName: airflow-sa
      initContainers:
      - name: kubectl-install
        image: curlimages/curl:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          curl -L https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl -o /tmp/kubectl
          chmod +x /tmp/kubectl
        volumeMounts:
        - name: kubectl-bin
          mountPath: /tmp
      - name: airflow-init
        image: apache/airflow:2.10.4
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          airflow db migrate
          airflow users create \
            --username admin --password admin \
            --firstname Admin --lastname Admin \
            --role Admin --email admin@example.com || true
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "sqlite:////opt/airflow/airflow.db"
        volumeMounts:
        - name: airflow-db
          mountPath: /opt/airflow
        - name: dags
          mountPath: /opt/airflow/dags
      containers:
      - name: airflow
        image: apache/airflow:2.10.4
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - airflow webserver & airflow scheduler & wait
        ports:
        - containerPort: 8080
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "sqlite:////opt/airflow/airflow.db"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "LocalExecutor"
        - name: AIRFLOW__WEBSERVER__WORKERS
          value: "1"
        - name: AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT
          value: "300"
        - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
          value: "30"
        - name: IN_K8S
          value: "true"
        - name: KUBECTL
          value: "/tmp/kubectl"
        volumeMounts:
        - name: airflow-db
          mountPath: /opt/airflow
        - name: dags
          mountPath: /opt/airflow/dags
        - name: kubectl-bin
          mountPath: /tmp
      volumes:
      - name: airflow-db
        emptyDir: {}
      - name: dags
        configMap:
          name: airflow-dags
      - name: kubectl-bin
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  type: NodePort
  selector:
    app: airflow
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30808
